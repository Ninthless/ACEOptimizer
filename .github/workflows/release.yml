name: Build and Release

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '8.0.x'
  NETSPARKLE_TOOL_VERSION: '2.9.0'
  SPARKLE_PUBLIC_KEY: 'J4bP9IT3dIqnPnxI1Q+bx+dFP5z/J6IbirO8uiCgr1U='

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
      AZURE_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Validate release tag
        id: version
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Release tag must use v<version> format, for example v1.2.13. Received: $tag"
          }

          $version = $tag.Substring(1)
          [xml]$csproj = Get-Content "ACEOptimizer.csproj"
          $projectVersion = [string]$csproj.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($projectVersion)) {
            throw "ACEOptimizer.csproj does not define a Version value."
          }
          if ($version -ne $projectVersion) {
            throw "Release tag version $version does not match ACEOptimizer.csproj version $projectVersion."
          }

          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Build and Release
        run: |
          echo "Building version ${{ steps.version.outputs.VERSION }}"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test ACEOptimizer.sln --configuration Release --no-build --no-restore

      - name: Publish
        run: dotnet publish ACEOptimizer.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./publish

      - name: Validate release secrets
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.NETSPARKLE_PRIVATE_KEY }}
        run: |
          $required = @(
            "AZURE_CLIENT_ID",
            "AZURE_TENANT_ID",
            "AZURE_SUBSCRIPTION_ID",
            "AZURE_SIGNING_ENDPOINT",
            "AZURE_SIGNING_ACCOUNT_NAME",
            "AZURE_SIGNING_CERTIFICATE_PROFILE_NAME",
            "SPARKLE_PRIVATE_KEY"
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            throw "Release signing configuration is incomplete: $($missing -join ', ')"
          }
        shell: pwsh

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Sign application
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\publish\ACEOptimizer.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: ACE Optimizer
          description-url: https://github.com/Ninthless/ACEOptimizer

      - name: Verify application signature
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath ".\publish\ACEOptimizer.exe"
          $signature | Format-List Status,StatusMessage,SignerCertificate,TimeStamperCertificate,Path
          if ($signature.Status -ne "Valid") {
            throw "Application signature is not valid: $($signature.Status) $($signature.StatusMessage)"
          }
        shell: pwsh

      - name: Setup Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $pwd = $PWD -replace '\\', '/'
          iscc installer/installer.iss `
            /DAppVersion="$version" `
            /DOutputDir="$pwd" `
            /DSourceDir="$pwd" `
            /DOutputBaseFilename="ACEOptimizer_Setup_v$version"
        shell: pwsh

      - name: Sign installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\ACEOptimizer_Setup_v${{ steps.version.outputs.VERSION }}.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: ACE Optimizer Setup
          description-url: https://github.com/Ninthless/ACEOptimizer

      - name: Verify installer signature
        run: |
          $installer = ".\ACEOptimizer_Setup_v${{ steps.version.outputs.VERSION }}.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          $signature | Format-List Status,StatusMessage,SignerCertificate,TimeStamperCertificate,Path
          if ($signature.Status -ne "Valid") {
            throw "Installer signature is not valid: $($signature.Status) $($signature.StatusMessage)"
          }
        shell: pwsh

      - name: Create portable archive
        run: |
          Compress-Archive -Path ./publish/ACEOptimizer.exe -DestinationPath ./ACEOptimizer_Portable_v${{ steps.version.outputs.VERSION }}.zip
        shell: pwsh

      - name: Generate release notes
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $tag = "${{ steps.version.outputs.TAG }}"
          $repo = "${{ github.repository }}"
          $previousTag = git tag --merged HEAD --list "v*" --sort=-version:refname |
            Where-Object { $_ -ne $tag } |
            Select-Object -First 1

          if ($previousTag) {
            $range = "$previousTag..HEAD"
            $compareUrl = "https://github.com/$repo/compare/$previousTag...$tag"
          } else {
            $range = "HEAD"
            $compareUrl = "https://github.com/$repo/commits/$tag"
          }

          $commits = git log $range --pretty=format:"%s" --no-merges |
            Where-Object {
              $_ -and
              $_ -notmatch '^chore:\s*bump version\b' -and
              $_ -notmatch '^chore:\s*trigger release\b'
            } |
            ForEach-Object { "- $_" }

          if (-not $commits) {
            $commits = @("- 常规维护与构建更新")
          }

          $notes = @"
          ## ACE Optimizer $tag

          ### 更新内容
          $($commits -join "`r`n")

          ### 下载

          | 文件 | 说明 |
          |------|------|
          | ACEOptimizer_Setup_v$version.exe | 安装程序 |
          | ACEOptimizer_Portable_v$version.zip | 便携版 |

          ### 完整变更
          - [查看完整对比]($compareUrl)

          ---

          **作者**: [@Ninthless](https://github.com/Ninthless)
          "@

          Set-Content -Path RELEASE_NOTES.md -Value $notes -Encoding UTF8
        shell: pwsh

      - name: Generate signed update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.NETSPARKLE_PRIVATE_KEY }}
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $tag = "${{ steps.version.outputs.TAG }}"
          $repo = "${{ github.repository }}"
          $installer = ".\ACEOptimizer_Setup_v$version.exe"
          $notesDirectory = ".\appcast-notes"

          New-Item -ItemType Directory -Force -Path $notesDirectory | Out-Null
          Copy-Item -LiteralPath ".\RELEASE_NOTES.md" -Destination "$notesDirectory\$version.md"

          dotnet tool install --global NetSparkleUpdater.Tools.AppCastGenerator --version "${{ env.NETSPARKLE_TOOL_VERSION }}"

          netsparkle-generate-appcast `
            --single-file $installer `
            --file-extract-version true `
            --appcast-output-directory "." `
            --base-url "https://github.com/$repo/releases/download/$tag" `
            --link-tag "https://github.com/$repo/releases/latest/download/appcast.xml" `
            --change-log-path $notesDirectory `
            --product-name "ACE Optimizer" `
            --description-tag "Signed update feed for ACE Optimizer" `
            --output-file-name "appcast" `
            --os "windows-x64" `
            --human-readable

          $signature = (Get-Content -Raw ".\appcast.xml.signature").Trim()
          netsparkle-generate-appcast --verify ".\appcast.xml" --signature $signature
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ACE Optimizer ${{ steps.version.outputs.TAG }}
          body_path: RELEASE_NOTES.md
          files: |
            ACEOptimizer_Setup_*.exe
            ACEOptimizer_Portable_*.zip
            appcast.xml
            appcast.xml.signature
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
